# Conda environment for the health data analytics labs (create with: conda env create -f environment.yml)
name: health-analytics
channels:
  - conda-forge
dependencies:
  - python=3.12
  - jupyterlab>=4.2
  - ipykernel
  - pandas>=2.2
  - numpy
  - matplotlib
  - seaborn
  - scikit-learn>=1.5
  - statsmodels
  - pyarrow
  - pip
  - pip:
      - duckdb>=1.1
      - jupysql>=0.10
      - duckdb-engine>=0.13
      - tensorflow>=2.16   # used for neural network labs; large download (~500 MB)
